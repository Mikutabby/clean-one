<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc6a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fondo circular -->
  <circle cx="200" cy="200" r="180" fill="#0a0a0a" stroke="url(#grad3)" stroke-width="3"/>
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#grad3)" stroke-width="1" opacity="0.3"/>

  <!-- Circuito decorativo -->
  <circle cx="200" cy="200" r="120" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.2"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.15"/>
  <circle cx="200" cy="200" r="100" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.25"/>

  <!-- Líneas de circuito -->
  <line x1="100" y1="200" x2="160" y2="200" stroke="#00d4ff" stroke-width="2" opacity="0.4"/>
  <line x1="240" y1="200" x2="300" y2="200" stroke="#00d4ff" stroke-width="2" opacity="0.4"/>
  <line x1="200" y1="100" x2="200" y2="160" stroke="#00ff88" stroke-width="2" opacity="0.4"/>
  <line x1="200" y1="240" x2="200" y2="300" stroke="#00ff88" stroke-width="2" opacity="0.4"/>

  <!-- Destornillador (izquierda) -->
  <g transform="translate(145, 145) rotate(-45)" filter="url(#glow)">
    <!-- Mango -->
    <rect x="0" y="0" width="14" height="50" rx="3" fill="url(#grad1)"/>
    <rect x="2" y="5" width="10" height="12" rx="2" fill="#0077aa" opacity="0.6"/>
    <rect x="2" y="22" width="10" height="12" rx="2" fill="#0077aa" opacity="0.6"/>
    <!-- Punta -->
    <polygon points="5,50 9,50 7,70" fill="#cccccc"/>
    <polygon points="6,65 8,65 7,75" fill="#aaaaaa"/>
  </g>

  <!-- Chip/CPU (centro) -->
  <g transform="translate(175, 175)" filter="url(#glow)">
    <!-- Cuerpo del chip -->
    <rect x="0" y="0" width="50" height="50" rx="5" fill="#1a1a2e" stroke="url(#grad3)" stroke-width="2"/>
    <!-- Núcleo -->
    <rect x="12" y="12" width="26" height="26" rx="3" fill="url(#grad2)" opacity="0.8"/>
    <!-- Circuitos internos -->
    <line x1="15" y1="25" x2="35" y2="25" stroke="#0a0a0a" stroke-width="1.5"/>
    <line x1="25" y1="15" x2="25" y2="35" stroke="#0a0a0a" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="4" fill="#0a0a0a"/>
    <circle cx="25" cy="25" r="2" fill="#00ff88"/>
    <!-- Pines -->
    <rect x="-8" y="8" width="8" height="3" rx="1" fill="#00d4ff"/>
    <rect x="-8" y="20" width="8" height="3" rx="1" fill="#00d4ff"/>
    <rect x="-8" y="32" width="8" height="3" rx="1" fill="#00d4ff"/>
    <rect x="50" y="8" width="8" height="3" rx="1" fill="#00d4ff"/>
    <rect x="50" y="20" width="8" height="3" rx="1" fill="#00d4ff"/>
    <rect x="50" y="32" width="8" height="3" rx="1" fill="#00d4ff"/>
    <rect x="8" y="-8" width="3" height="8" rx="1" fill="#00d4ff"/>
    <rect x="20" y="-8" width="3" height="8" rx="1" fill="#00d4ff"/>
    <rect x="32" y="-8" width="3" height="8" rx="1" fill="#00d4ff"/>
    <rect x="8" y="50" width="3" height="8" rx="1" fill="#00d4ff"/>
    <rect x="20" y="50" width="3" height="8" rx="1" fill="#00d4ff"/>
    <rect x="32" y="50" width="3" height="8" rx="1" fill="#00d4ff"/>
  </g>

  <!-- Llave inglesa (derecha) -->
  <g transform="translate(230, 140) rotate(45)" filter="url(#glow)">
    <!-- Cabeza -->
    <circle cx="25" cy="25" r="18" fill="none" stroke="url(#grad1)" stroke-width="5"/>
    <circle cx="25" cy="25" r="10" fill="#0a0a0a" stroke="#00d4ff" stroke-width="2"/>
    <!-- Mango -->
    <rect x="22" y="43" width="6" height="40" rx="2" fill="url(#grad1)"/>
    <!-- Mordazas -->
    <path d="M7,15 L15,25 L7,35" fill="none" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
    <path d="M43,15 L35,25 L43,35" fill="none" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Gotas de limpieza -->
  <g filter="url(#glow)">
    <path d="M120,280 Q125,265 130,280 Q125,295 120,280" fill="#00d4ff" opacity="0.6"/>
    <path d="M280,290 Q285,275 290,290 Q285,305 280,290" fill="#00ff88" opacity="0.6"/>
    <path d="M300,260 Q303,250 306,260 Q303,270 300,260" fill="#00d4ff" opacity="0.4"/>
  </g>

  <!-- Texto -->
  <text x="200" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#grad3)" filter="url(#glow)">
    KIT TECH
  </text>
  <text x="200" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888" letter-spacing="4">
    MANTENIMIENTO TECNOLÓGICO
  </text>
</svg>
